<!DOCTYPE html>
<html lang="es">
<head>
    <title>Registrar Actividad</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>

<header>
    <img src="../img/logo.png" alt="logo">
    <nav>
        <a href="index.html">Inicio</a>
    </nav>
</header>

<div class="container">
    <h1>Registrar Actividad</h1>

    <form id="formActividad">
        <label>Miembro *</label>
        <input id="miembro" type="text">

        <label>Tipo de Actividad *</label>
        <select id="tipoActividad">
            <option>Deportiva</option>
            <option>Artística</option>
            <option>Tecnológica</option>
        </select>

        <label>Nombre *</label>
        <input id="nombreActividad" type="text">

        <label>Descripción *</label>
        <textarea id="descripcion"></textarea>

        <label>Día y Hora *</label>
        <input id="horario" type="text">

        <label>Archivo (foto/video) *</label>
        <input id="archivo" type="file">

        <label>Enlace</label>
        <input id="enlace" type="text">

        <button>Registrar</button>
    </form>
</div>
<script src="../js/validar_actividad.js"></script>
</body>
</html>
