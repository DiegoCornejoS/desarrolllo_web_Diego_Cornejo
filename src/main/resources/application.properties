# ===== Configuración de Base de Datos MySQL =====
spring.datasource.url=jdbc:mysql://localhost:3306/tarea2?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago
spring.datasource.username=cc5002
spring.datasource.password=programacionweb
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=true

# ===== Servidor =====
server.port=8080

# ===== Recursos estáticos: servir imágenes subidas =====
spring.web.resources.static-locations=classpath:/static/,file:./

# ===== Seguridad: no exponer detalles internos de errores =====
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.error.include-exception=false

